name: PR Validation

on:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6

      - name: Run tests
        run: go test -tags LINUX -timeout 120s ./...

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6

      - name: Run e2e tests
        run: bash scripts/e2e_test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.6

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o blueiris_exporter-amd64-linux -tags LINUX

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o blueiris_exporter-amd64.exe
